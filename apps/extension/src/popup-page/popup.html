<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carve</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e2128;
      color: #e8eaf0;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      color: #4caf50;
    }
    .section {
      background: #13151a;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .label {
      font-size: 11px;
      color: #6b7a99;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .due-count {
      font-size: 36px;
      font-weight: 700;
      color: #4caf50;
      line-height: 1.1;
    }
    .due-count.zero { color: #6b7a99; }
    .review-link {
      display: block;
      margin-top: 10px;
      padding: 8px 12px;
      background: #4caf50;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      transition: background 0.15s;
    }
    .review-link:hover { background: #43a047; }
    .review-link.disabled {
      background: #2a2d36;
      color: #6b7a99;
      cursor: default;
    }
    .status {
      font-size: 11px;
      color: #6b7a99;
      margin-top: 6px;
    }
    .status.error { color: #ef9a9a; }

    /* Login form */
    #login-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }
    #login-form input {
      width: 100%;
      padding: 7px 10px;
      background: #1e2128;
      border: 1px solid #2d3344;
      border-radius: 6px;
      color: #e8eaf0;
      font-size: 13px;
      outline: none;
    }
    #login-form input:focus { border-color: #4caf50; }
    #login-form button {
      padding: 8px;
      background: #4caf50;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #login-form button:disabled { opacity: 0.6; cursor: default; }
    .error-msg {
      font-size: 12px;
      color: #ef9a9a;
      margin-bottom: 6px;
    }

    /* Site toggle */
    .site-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #13151a;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 10px;
    }
    .site-row-label {
      font-size: 12px;
      color: #9ba8c0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }
    .site-row-label span { color: #6b7a99; font-size: 11px; display: block; }
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: #2d3344;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle input:checked + .toggle-track { background: #4caf50; }
    .toggle-track::after {
      content: '';
      position: absolute;
      left: 2px;
      top: 2px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .toggle-track::after { transform: translateX(16px); }

    /* Sign out */
    #logout-btn {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 5px;
      background: none;
      border: 1px solid #2d3344;
      border-radius: 6px;
      color: #6b7a99;
      font-size: 11px;
      cursor: pointer;
    }
    #logout-btn:hover { color: #9ba8c0; border-color: #3d4555; }

    /* Overlay toggle */
    .overlay-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #13151a;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 10px;
    }
    .overlay-row-label { font-size: 12px; color: #9ba8c0; }
    .overlay-pct-badge {
      font-size: 11px;
      font-weight: 600;
      color: #4caf50;
      margin-left: 6px;
    }
    .lang-select {
      background: #1e2128;
      color: #e8eaf0;
      border: 1px solid #2a2d36;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .lang-select:hover { border-color: #4caf50; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">Carve</span>
  </div>
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
