<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carve</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e2128;
      color: #e8eaf0;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      color: #4caf50;
    }
    .section {
      background: #13151a;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .label {
      font-size: 11px;
      color: #6b7a99;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .due-count {
      font-size: 36px;
      font-weight: 700;
      color: #4caf50;
      line-height: 1.1;
    }
    .due-count.zero { color: #6b7a99; }
    .review-link {
      display: block;
      margin-top: 10px;
      padding: 8px 12px;
      background: #4caf50;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      transition: background 0.15s;
    }
    .review-link:hover { background: #43a047; }
    .review-link.disabled {
      background: #2a2d36;
      color: #6b7a99;
      cursor: default;
    }
    .status {
      font-size: 11px;
      color: #6b7a99;
      margin-top: 6px;
    }
    .status.error { color: #ef9a9a; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">Carve</span>
  </div>

  <div class="section">
    <div class="label">Cards due today</div>
    <div class="due-count" id="due-count">—</div>
    <div class="status" id="status">Checking…</div>
  </div>

  <a href="http://localhost:5173/cards" target="_blank" class="review-link" id="review-link">
    Open review queue →
  </a>

  <script src="app.js"></script>
</body>
</html>
