[package]
name = "zh-tokenizer"
version = "0.1.0"
edition = "2021"
description = "In-browser Chinese (Mandarin) tokenizer compiled to WASM"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jieba-rs = "0.7"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "s"
lto = true
