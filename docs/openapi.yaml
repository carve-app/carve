        '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/onboarding/starter-deck:
    post:
      tags: [onboarding]
      operationId: onboardingStarterDeck
      summary: Subscribe the user to the official starter deck for a language
      security: [{ bearer: [] }]
      requestBody:
        required: true
