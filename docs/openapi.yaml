openapi: 3.0.3
info:
  title: Carve API
  description: |
    The Carve language-learning API. This document is the source of truth for
    every `/v1` endpoint; the TypeScript client in `apps/web/src/lib/api.ts`
    is regenerated from it and schemathesis runs property-based HTTP fuzz
    against it as part of the L4 testing layer.
  version: 0.3.0
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.carve.app
    description: Production

security: []  # default: no auth; protected operations explicitly set `security: [{ bearer: [] }]`

tags:
  - name: auth
  - name: users
  - name: onboarding
  - name: cards
  - name: review
  - name: decks
  - name: settings
  - name: immersion
  - name: billing
  - name: stats
  - name: library
  - name: import
  - name: output
  - name: sync
  - name: nlp
  - name: export
  - name: system

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Common ────────────────────────────────────────────────────────────
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Ok:
      type: object
      properties:
        ok: { type: boolean }
    UUID:
      type: string
      format: uuid
    LanguageCode:
      type: string
      enum: [ja, zh-cn, zh-tw, zh, ko, en]

    # ── Auth ──────────────────────────────────────────────────────────────
    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 100 }
    AuthRegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email:        { type: string, format: email }
        password:     { type: string, minLength: 8, maxLength: 100 }
        display_name: { type: string, minLength: 1, maxLength: 80 }
    AuthTokenResponse:
      type: object
      required: [access_token, expires_in, user]
      properties:
        access_token: { type: string }
        expires_in:   { type: integer, description: "Lifetime of access_token in seconds" }
        user:         { $ref: '#/components/schemas/AuthUser' }
    AuthUser:
      type: object
      required: [id, email, display_name]
      properties:
        id:           { $ref: '#/components/schemas/UUID' }
        email:        { type: string, format: email }
        display_name: { type: string }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:    { type: string, minLength: 16, maxLength: 200 }
        password: { type: string, minLength: 8, maxLength: 100 }
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 16, maxLength: 200 }
    ResendVerifyRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    # ── Users ─────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, email, display_name, created_at]
      properties:
        id:           { $ref: '#/components/schemas/UUID' }
        email:        { type: string, format: email }
        display_name: { type: string }
        avatar_url:   { type: string, nullable: true }
        created_at:   { type: string, format: date-time }
    UserUpdateRequest:
      type: object
      properties:
        display_name: { type: string, nullable: true, minLength: 1, maxLength: 80 }
        avatar_url:   { type: string, nullable: true }

    # ── Onboarding ────────────────────────────────────────────────────────
    OnboardingKnownWordsRequest:
      type: object
      required: [language, lemmas]
      properties:
        language: { $ref: '#/components/schemas/LanguageCode' }
        lemmas:
          type: array
          items: { type: string }
          maxItems: 50000
    OnboardingKnownWordsResponse:
      type: object
      required: [marked]
      properties:
        marked: { type: integer, minimum: 0 }
    OnboardingStarterDeckRequest:
      type: object
      required: [language]
      properties:
        language: { $ref: '#/components/schemas/LanguageCode' }
    OnboardingStarterDeckResponse:
      type: object
      required: [status]
      properties:
        status:  { type: string, enum: [subscribed, no_deck] }
        deck_id: { type: string }

    # ── Cards ─────────────────────────────────────────────────────────────
    Card:
      type: object
      required: [id, front_text, fsrs_state]
      properties:
        id:                  { $ref: '#/components/schemas/UUID' }
        language_code:       { type: string, minLength: 2, maxLength: 5 }
        front_text:          { type: string }
        back_text:           { type: string, nullable: true }
        sentence:            { type: string, nullable: true }
        subtitle_translation: { type: string, nullable: true }
        source_url:          { type: string, nullable: true }
        video_source_url:    { type: string, nullable: true }
        audio_url:           { type: string, nullable: true }
        image_url:           { type: string, nullable: true }
        subtitle_start_ms:   { type: integer, nullable: true }
        subtitle_end_ms:     { type: integer, nullable: true }
        fsrs_state:          { type: string, enum: [new, learning, review, relearning, suspended] }
        stability:           { type: number, nullable: true }
        difficulty:          { type: number, nullable: true }
        fsrs_due:            { type: string, format: date-time, nullable: true }
        reps:                { type: integer, minimum: 0 }
        lapses:              { type: integer, minimum: 0 }
        suspended:           { type: boolean }
        is_leech:            { type: boolean }
        notes:               { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        created_at:          { type: string, format: date-time }
    CardListItem:
      type: object
      required: [id, lemma, front_text, fsrs_state]
      properties:
        id:         { $ref: '#/components/schemas/UUID' }
        lemma:      { type: string }
        front_text: { type: string }
        back_text:  { type: string }
        sentence:   { type: string, nullable: true }
        source_url: { type: string, nullable: true }
        fsrs_state: { type: string, enum: [new, learning, review, relearning, suspended] }
        fsrs_due:   { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        suspended:  { type: boolean }
        is_leech:   { type: boolean }
        tags:
          type: array
          items: { type: string }
    CardCreateRequest:
      type: object
      required: [language_code, lemma]
      properties:
        language_code:        { $ref: '#/components/schemas/LanguageCode' }
        lemma:                { type: string, minLength: 1, maxLength: 500 }
        reading:              { type: string }
        back_text:            { type: string, nullable: true }
        subtitle_translation: { type: string, nullable: true }
        sentence:             { type: string, nullable: true }
        source_url:           { type: string, nullable: true }
        source_timestamp:     { type: number, nullable: true }
    CardCreateResponse:
      type: object
      required: [id]
      properties:
        id:        { $ref: '#/components/schemas/UUID' }
        is_leech:  { type: boolean }
    CardUpdateRequest:
      type: object
      properties:
        front_text:           { type: string, nullable: true }
        front_reading:        { type: string, nullable: true }
        back_text:            { type: string, nullable: true }
        sentence:             { type: string, nullable: true }
        subtitle_translation: { type: string, nullable: true }
        notes:                { type: string, nullable: true }
        deck_id:              { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
    CardListResponse:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          items: { $ref: '#/components/schemas/CardListItem' }
    CardBulkRequest:
      type: object
      required: [action, ids]
      properties:
        action: { type: string, enum: [delete, suspend, unsuspend, bury, tag, untag] }
        ids:
          type: array
          items: { $ref: '#/components/schemas/UUID' }
          maxItems: 5000
        tag: { type: string }
    CardBulkResponse:
      type: object
      properties:
        affected: { type: integer, minimum: 0 }
    # ── Review ────────────────────────────────────────────────────────────
    DueCountResponse:
      type: object
      required: [due_count]
      properties:
        due_count:    { type: integer, minimum: 0 }
        new_due:      { type: integer, minimum: 0 }
        review_due:   { type: integer, minimum: 0 }
        learning_due: { type: integer, minimum: 0 }
    SessionCard:
      type: object
      required: [id, front_text, fsrs_state]
      properties:
        id:         { $ref: '#/components/schemas/UUID' }
        front_text: { type: string }
        back_text:  { type: string, nullable: true }
        sentence:   { type: string, nullable: true }
        source_url: { type: string, nullable: true }
        audio_url:  { type: string, nullable: true }
        image_url:  { type: string, nullable: true }
        fsrs_state: { type: string, enum: [new, learning, review, relearning, suspended] }
        stability:  { type: number, nullable: true }
        difficulty: { type: number, nullable: true }
        due:        { type: string, format: date-time, nullable: true }
        reps:       { type: integer, minimum: 0 }
        lapses:     { type: integer, minimum: 0 }
    ReviewSessionResponse:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          items: { $ref: '#/components/schemas/SessionCard' }
        new_count:    { type: integer, minimum: 0 }
        review_count: { type: integer, minimum: 0 }
    ReviewEventRequest:
      type: object
      required: [card_id, rating]
      properties:
        card_id:       { $ref: '#/components/schemas/UUID' }
        rating:        { type: integer, minimum: 1, maximum: 4 }
        time_taken_ms: { type: integer, minimum: 0, nullable: true }
        reviewed_at:   { type: string, format: date-time }
    ReviewEventResponse:
      type: object
      required: [next_due, is_leech]
      properties:
        next_due: { type: string, format: date-time }
        is_leech: { type: boolean }
        stability:  { type: number, nullable: true }
        difficulty: { type: number, nullable: true }
        state:      { type: string, enum: [new, learning, review, relearning, suspended] }
    UndoResponse:
      type: object
      properties:
        ok:      { type: boolean }
        card_id: { $ref: '#/components/schemas/UUID' }
    IntervalsResponse:
      type: object
      properties:
        again: { type: string, format: date-time }
        hard:  { type: string, format: date-time }
        good:  { type: string, format: date-time }
        easy:  { type: string, format: date-time }
    ForecastBucket:
      type: object
      required: [date, count]
      properties:
        date:  { type: string }
        count: { type: integer, minimum: 0 }
    ForecastResponse:
      type: object
      required: [forecast]
      properties:
        forecast:
          type: array
          items: { $ref: '#/components/schemas/ForecastBucket' }
    Notification:
      type: object
      required: [id, type, created_at]
      properties:
        id:         { $ref: '#/components/schemas/UUID' }
        type:       { type: string }
        payload:    { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    NotificationsResponse:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items: { $ref: '#/components/schemas/Notification' }

    # ── Decks ─────────────────────────────────────────────────────────────
    Deck:
      type: object
      required: [id, name, is_public, is_official, card_count, created_at]
      properties:
        id:             { $ref: '#/components/schemas/UUID' }
        name:           { type: string }
        description:    { type: string, nullable: true }
        is_public:      { type: boolean }
        is_official:    { type: boolean }
        tags:
          type: array
          items: { type: string }
        card_count:     { type: integer, minimum: 0 }
        download_count: { type: integer, minimum: 0 }
        avg_rating:     { type: number, nullable: true }
        is_subscribed:  { type: boolean }
        created_at:     { type: string, format: date-time }
    DeckListResponse:
      type: object
      required: [decks]
      properties:
        decks:
          type: array
          items: { $ref: '#/components/schemas/Deck' }
    DeckCreateRequest:
      type: object
      required: [name]
      properties:
        name:          { type: string, minLength: 1, maxLength: 200 }
        description:   { type: string }
        language_code: { $ref: '#/components/schemas/LanguageCode' }
        tags:
          type: array
          items: { type: string }
        is_public:     { type: boolean }
    DeckCreateResponse:
      type: object
      required: [id, name]
      properties:
        id:   { $ref: '#/components/schemas/UUID' }
        name: { type: string }
    DeckUpdateRequest:
      type: object
      properties:
        name:        { type: string, nullable: true }
        description: { type: string, nullable: true }
        is_public:   { type: boolean, nullable: true }
        tags:
          type: array
          items: { type: string }
    DeckRateRequest:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }

    # ── Settings ──────────────────────────────────────────────────────────
    FSRSSettings:
      type: object
      required: [language_code, weights, target_retention, leech_threshold, daily_new_limit]
      properties:
        language_code:    { $ref: '#/components/schemas/LanguageCode' }
        weights:
          type: array
          items: { type: number }
          minItems: 19
          maxItems: 19
        target_retention: { type: number, minimum: 0.5, maximum: 0.99 }
        leech_threshold:  { type: integer, minimum: 1, maximum: 99 }
        daily_new_limit:  { type: integer, minimum: 0, maximum: 9999 }
        updated_at:       { type: string, format: date-time }
        is_customized:    { type: boolean }
    FSRSSettingsRequest:
      type: object
      required: [language_code]
      properties:
        language_code:    { $ref: '#/components/schemas/LanguageCode' }
        weights:
          type: array
          items: { type: number }
        target_retention: { type: number, nullable: true, minimum: 0.5, maximum: 0.99 }
        leech_threshold:  { type: integer, nullable: true, minimum: 1, maximum: 99 }
        daily_new_limit:  { type: integer, nullable: true, minimum: 0, maximum: 9999 }
    WorkloadPreviewResponse:
      type: object
      required: [target_retention, avg_interval_days, total_review_cards]
      properties:
        target_retention:   { type: number }
        avg_interval_days:  { type: number }
        total_review_cards: { type: integer, minimum: 0 }
    FSRSOptimizeResponse:
      type: object
      properties:
        status:  { type: string, enum: [ok, insufficient_data, in_progress] }
        message: { type: string }
        weights:
          type: array
          items: { type: number }

    # ── Immersion ─────────────────────────────────────────────────────────
    ImmersionCreateRequest:
      type: object
      required: [language_code, session_type, duration_sec, started_at]
      properties:
        language_code: { $ref: '#/components/schemas/LanguageCode' }
        session_type:  { type: string, enum: [reading, listening, video, writing] }
        duration_sec:  { type: integer, minimum: 1, maximum: 86399 }
        started_at:    { type: string, format: date-time }
        url:           { type: string, nullable: true }

    # ── Billing ───────────────────────────────────────────────────────────
    Subscription:
      type: object
      required: [tier, status]
      properties:
        tier:                { type: string, enum: [free, learner, pro] }
        status:              { type: string }
        current_period_end:  { type: string, format: date-time, nullable: true }
    CheckoutRequest:
      type: object
      required: [tier]
      properties:
        tier: { type: string, enum: [learner, pro] }
    CheckoutResponse:
      type: object
      required: [url]
      properties:
        url: { type: string }

    # ── Stats ─────────────────────────────────────────────────────────────
    WordGrowthEntry:
      type: object
      required: [date, known_count, mature_count, learning_count]
      properties:
        date:           { type: string }
        known_count:    { type: integer, minimum: 0 }
        mature_count:   { type: integer, minimum: 0 }
        learning_count: { type: integer, minimum: 0 }
    StatsDashboardResponse:
      type: object
      required: [language_code, known_cards, learning_cards]
      properties:
        language_code:      { $ref: '#/components/schemas/LanguageCode' }
        known_cards:        { type: integer, minimum: 0 }
        learning_cards:     { type: integer, minimum: 0 }
        retention_30d:      { type: number, minimum: 0, maximum: 1 }
        total_reviews:      { type: integer, minimum: 0 }
        total_ever_reviews: { type: integer, minimum: 0 }
        streak_days:        { type: integer, minimum: 0 }
        reading_minutes:    { type: integer, minimum: 0 }
        listening_minutes:  { type: integer, minimum: 0 }
        word_growth:
          type: array
          items: { $ref: '#/components/schemas/WordGrowthEntry' }

    # ── Library ───────────────────────────────────────────────────────────
    LibraryItem:
      type: object
      required: [id, title, content_type, created_at]
      properties:
        id:                 { $ref: '#/components/schemas/UUID' }
        url:                { type: string, nullable: true }
        title:              { type: string }
        comprehension_pct:  { type: number, nullable: true }
        unknown_word_count: { type: integer, nullable: true }
        content_type:       { type: string, enum: [url, epub, txt, srt] }
        created_at:         { type: string, format: date-time }
    LibraryListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LibraryItem' }
    LibraryAddRequest:
      type: object
      required: [url, language]
      properties:
        url:      { type: string, format: uri }
        language: { $ref: '#/components/schemas/LanguageCode' }
    LibraryAddResponse:
      type: object
      required: [id, title]
      properties:
        id:                { $ref: '#/components/schemas/UUID' }
        title:             { type: string }
        comprehension_pct: { type: number, nullable: true }
    ReaderResponse:
      type: object
      required: [item_id, tokens]
      properties:
        item_id:           { $ref: '#/components/schemas/UUID' }
        title:             { type: string }
        comprehension_pct: { type: number, nullable: true }
        tokens:
          type: array
          items: { type: object, additionalProperties: true }

    # ── Import ────────────────────────────────────────────────────────────
    ImportResultResponse:
      type: object
      properties:
        imported:    { type: integer, minimum: 0 }
        skipped:     { type: integer, minimum: 0 }
        deck_id:     { type: string, nullable: true }
        deck_name:   { type: string, nullable: true }
        scheduling_preserved: { type: boolean }
        warnings:
          type: array
          items: { type: string }

    # ── Output ────────────────────────────────────────────────────────────
    OutputExercise:
      type: object
      required: [id, exercise_type, prompt, target_word, created_at]
      properties:
        id:            { $ref: '#/components/schemas/UUID' }
        exercise_type: { type: string, enum: [writing, cloze, shadowing, speaking] }
        prompt:        { type: string }
        target_word:   { type: string }
        sentence:      { type: string, nullable: true }
        audio_url:     { type: string, nullable: true }
        created_at:    { type: string }
    OutputExercisesResponse:
      type: object
      required: [exercises]
      properties:
        exercises:
          type: array
          items: { $ref: '#/components/schemas/OutputExercise' }
    OutputSubmitRequest:
      type: object
      required: [exercise_id, answer_text]
      properties:
        exercise_id: { $ref: '#/components/schemas/UUID' }
        answer_text: { type: string, minLength: 1, maxLength: 5000 }
    OutputFeedback:
      type: object
      required: [score, feedback]
      properties:
        score:        { type: number, minimum: 0, maximum: 1 }
        feedback:     { type: string }
        grammar:      { type: string }
        vocabulary:   { type: string }
        naturalness:  { type: string }
    ShadowingItem:
      type: object
      required: [id, audio_url]
      properties:
        id:               { $ref: '#/components/schemas/UUID' }
        audio_url:        { type: string }
        transcript:       { type: string, nullable: true }
        times_shadowed:   { type: integer, minimum: 0 }
        last_shadowed_at: { type: string, nullable: true }
        card_front:       { type: string, nullable: true }
    ShadowingQueueResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ShadowingItem' }
    TranscribeDiff:
      type: object
      properties:
        op:  { type: string, enum: [keep, sub, insert, delete] }
        ref: { type: string }
        hyp: { type: string }
    TranscribeResponse:
      type: object
      required: [transcript, language, diff, wer]
      properties:
        transcript: { type: string }
        language:   { type: string }
        wer:        { type: number, minimum: 0 }
        diff:
          type: array
          items: { $ref: '#/components/schemas/TranscribeDiff' }

    # ── Sync (AnkiConnect bridge) ─────────────────────────────────────────
    AnkiConnectTestRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    AnkiConnectTestResponse:
      type: object
      required: [ok]
      properties:
        ok:    { type: boolean }
        decks:
          type: array
          items: { type: string }
        error: { type: string }
    AnkiConnectSyncRequest:
      type: object
      required: [url]
      properties:
        url:  { type: string, format: uri }
        deck: { type: string }
    AnkiConnectSyncResponse:
      type: object
      properties:
        pushed: { type: integer, minimum: 0 }
        pulled: { type: integer, minimum: 0 }
        errors:
          type: array
          items: { type: string }

    # ── NLP ───────────────────────────────────────────────────────────────
    TokenizeRequest:
      type: object
      required: [text, language]
      properties:
        text:     { type: string, maxLength: 50000 }
        language: { $ref: '#/components/schemas/LanguageCode' }
        mode:     { type: string, enum: [A, B, C], description: "Sudachi mode (JA only)" }
    TokenizeResponse:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items: { type: object, additionalProperties: true }
    LookupRequest:
      type: object
      required: [surface, language]
      properties:
        surface:     { type: string, maxLength: 200 }
        language:    { $ref: '#/components/schemas/LanguageCode' }
        target_lang: { type: string, maxLength: 5, default: en }
        context:     { type: string, maxLength: 500 }
    LookupResponse:
      type: object
      properties:
        entries:
          type: array
          items: { type: object, additionalProperties: true }
    ScoreContentRequest:
      type: object
      required: [text, language]
      properties:
        text:     { type: string, maxLength: 200000 }
        language: { $ref: '#/components/schemas/LanguageCode' }
        known_lemmas:
          type: array
          items: { type: string }
    ScoreContentResponse:
      type: object
      properties:
        comprehension_pct: { type: number, minimum: 0, maximum: 1 }
        unknown_count:     { type: integer, minimum: 0 }
        known_count:       { type: integer, minimum: 0 }
        total_tokens:      { type: integer, minimum: 0 }
    TranslateRequest:
      type: object
      required: [text]
      properties:
        text:            { type: string, maxLength: 5000 }
        source_language: { type: string, default: ja }
        target_language: { $ref: '#/components/schemas/LanguageCode' }
    TranslateResponse:
      type: object
      properties:
        translation:     { type: string }
        source_language: { type: string }
        target_language: { type: string }

    # ── Export ────────────────────────────────────────────────────────────
    ExportResponse:
      type: object
      description: Full user data dump. Shape intentionally loose (forward-compat).
      additionalProperties: true

paths:
  # ── System ────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:  { type: string }
                  service: { type: string }
                  version: { type: string }

  /metrics:
    get:
      tags: [system]
      operationId: getMetrics
      summary: Prometheus metrics
      responses:
        '200':
          description: Prometheus exposition format
          content:
            text/plain: { schema: { type: string } }

  # ── Auth ──────────────────────────────────────────────────────────────
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AuthLoginRequest' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokenResponse' } } } }
        '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AuthRegisterRequest' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokenResponse' } } } }
        '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Email taken, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Refresh the access token using the refresh-token cookie
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokenResponse' } } } }
        '401': { description: No / expired refresh token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Invalidate the active refresh token
      responses:
        '204': { description: Logged out }

  /v1/auth/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Send a password-reset email
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ForgotPasswordRequest' } }
      responses:
        '200': { description: Always 200 to prevent email enumeration, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/auth/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Complete a password reset
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ResetPasswordRequest' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { description: Bad / expired token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/auth/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Mark the user's email as verified using a token
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/VerifyEmailRequest' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean }
        '400': { description: Bad / expired token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/auth/verify/resend:
    post:
      tags: [auth]
      operationId: resendVerify
      summary: Resend the email-verification email
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ResendVerifyRequest' } }
      responses:
        '200':
          description: Always 200 to prevent enumeration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'

