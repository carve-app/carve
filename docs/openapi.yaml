  # ── Decks ─────────────────────────────────────────────────────────────
  /v1/decks:
    get:
      tags: [decks]
      operationId: listDecks
      summary: List the user's own decks plus subscribed/public decks
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [mine, public, subscribed] }
        - in: query
          name: language
          schema: { $ref: '#/components/schemas/LanguageCode' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DeckListResponse' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      tags: [decks]
      operationId: createDeck
      summary: Create a new deck
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/DeckCreateRequest' } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/DeckCreateResponse' } } } }
        '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/decks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { $ref: '#/components/schemas/UUID' }
    patch:
      tags: [decks]
      operationId: updateDeck
      summary: Update a deck the user owns
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/DeckUpdateRequest' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
