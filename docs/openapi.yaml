    post:
      tags: [decks]
      operationId: subscribeDeck
      summary: Subscribe to a public deck
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Subscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscribed: { type: boolean }
                  deck_id:    { $ref: '#/components/schemas/UUID' }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Deck is not public, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [decks]
      operationId: unsubscribeDeck
      summary: Unsubscribe from a deck
      security: [{ bearer: [] }]
      responses:
        '204': { description: Unsubscribed }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/decks/{id}/rate:
    parameters:
      - in: path
        name: id
        required: true
        schema: { $ref: '#/components/schemas/UUID' }
    post:
      tags: [decks]
      operationId: rateDeck
      summary: Rate a deck (1–5 stars)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/DeckRateRequest' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rated: { type: boolean }
        '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ── Export ────────────────────────────────────────────────────────────
  /v1/export:
    get:
