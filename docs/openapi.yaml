      parameters:
        - in: query
          name: language
          schema: { $ref: '#/components/schemas/LanguageCode' }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewSessionResponse' } } } }
