      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingStarterDeckResponse' } } } }
        '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ── Cards ─────────────────────────────────────────────────────────────
  /v1/cards:
    get:
      tags: [cards]
      operationId: listCards
      summary: List the user's cards
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: language
          schema: { $ref: '#/components/schemas/LanguageCode' }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500 }
        - in: query
          name: state
          schema: { type: string, enum: [new, learning, review, relearning, suspended] }
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CardListResponse' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      tags: [cards]
      operationId: createCard
      summary: Create a card (mining)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CardCreateRequest' } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CardCreateResponse' } } } }
        '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/cards/bulk:
    post:
      tags: [cards]
      operationId: bulkCards
      summary: Apply a bulk action to a set of cards
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CardBulkRequest' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CardBulkResponse' } } } }
        '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/cards/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { $ref: '#/components/schemas/UUID' }
    get:
      tags: [cards]
      operationId: getCard
      summary: Get a card by id
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Card' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      tags: [cards]
      operationId: updateCard
      summary: Update a card
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CardUpdateRequest' } }
      responses:
        '204': { description: Updated }
        '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [cards]
      operationId: deleteCard
      summary: Delete a card
      security: [{ bearer: [] }]
      responses:
        '204': { description: Deleted }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/cards/{id}/media:
    parameters:
      - in: path
        name: id
        required: true
        schema: { $ref: '#/components/schemas/UUID' }
    post:
      tags: [cards]
      operationId: attachMedia
      summary: Upload image/audio (and subtitle metadata) for a card
      description: >
        Multipart upload. All parts are optional; the handler stores whatever is
        provided and returns the resulting URLs (null when not uploaded).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:                { type: string, format: binary }
                audio:                { type: string, format: binary }
                subtitle_start_ms:    { type: integer }
                subtitle_end_ms:      { type: integer }
                video_source_url:     { type: string }
                subtitle_translation: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  image_url: { type: string, nullable: true }
                  audio_url: { type: string, nullable: true }
        '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Card not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/cards/{id}/suspend:
    parameters:
      - in: path
        name: id
        required: true
        schema: { $ref: '#/components/schemas/UUID' }
    post:
      tags: [cards]
      operationId: suspendCard
      summary: Suspend a card (skip in review until manually unsuspended)
      security: [{ bearer: [] }]
      responses:
        '204': { description: Suspended }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/cards/{id}/unsuspend:
    parameters:
      - in: path
        name: id
        required: true
        schema: { $ref: '#/components/schemas/UUID' }
    post:
      tags: [cards]
      operationId: unsuspendCard
      summary: Un-suspend a card
      security: [{ bearer: [] }]
      responses:
        '204': { description: Unsuspended }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/cards/{id}/bury:
    parameters:
      - in: path
        name: id
        required: true
        schema: { $ref: '#/components/schemas/UUID' }
    post:
      tags: [cards]
      operationId: buryCard
      summary: Bury a card until tomorrow
      security: [{ bearer: [] }]
      responses:
        '204': { description: Buried until tomorrow }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ── Review ────────────────────────────────────────────────────────────
  /v1/review/due-count:
    get:
      tags: [review]
