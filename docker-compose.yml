# Carve development environment
# Start everything: docker compose up
# Start specific service: docker compose up postgres redis

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carve
      POSTGRES_PASSWORD: carve
      POSTGRES_DB: carve
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carve"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Services ───────────────────────────────────────────────────────────────

  migrate:
    build:
      context: services/api
      dockerfile: Dockerfile
    command: ["./migrate", "--dir", "./migrations"]
    environment:
      DATABASE_URL: postgres://carve:carve@postgres:5432/carve?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: services/api
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://carve:carve@postgres:5432/carve?sslmode=disable
      JWT_SECRET: dev-secret-change-in-production-at-least-32-chars
      PORT: "8080"
      # Dev runs over plain http, so the refresh cookie must NOT be Secure (a
      # Secure cookie is silently dropped over http and refresh breaks). Prod
      # leaves this unset → Secure cookie.
      COOKIE_INSECURE: "1"
      NLP_SERVICE_URL: http://nlp:8001
      # The API proxies card media uploads to the media service; without this it
      # defaults to localhost:8002 (unreachable from inside the api container)
      # and every screenshot/audio upload silently no-ops.
      MEDIA_SERVICE_URL: http://media:8002
      # Google Cloud TTS (best-on-market). Synthesizes word/sentence audio via a
      # service account and persists MP3s to the media service. When unset, cards
      # simply have no audio (no lower-quality fallback). Mount the SA JSON and
      # point this at it, e.g.:
      #   volumes: [ "./secrets/gcp-sa.json:/secrets/gcp-sa.json:ro" ]
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: no-reply@carve.local
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  nlp:
    build:
      context: services/nlp
      dockerfile: Dockerfile
    ports:
      - "${NLP_PORT:-8001}:8001"
    environment:
      DICT_DB_PATH: /app/data/dictionary.db
      NLP_INTERNAL_SECRET: ""   # empty = no auth check in dev
      PORT: "8001"
      # Fluent sentence translation via Google Cloud Translation v3 (Translation
      # LLM) — the single engine, no gloss/corpus fallback. Authenticated with a
      # service account; set GOOGLE_APPLICATION_CREDENTIALS to the mounted SA
      # JSON. When unset, /translate returns null (cards have no translation
      # rather than a low-quality one).
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  media:
    build:
      context: services/media
      dockerfile: Dockerfile
    ports:
      - "${MEDIA_PORT:-8002}:8002"
    environment:
      PORT: "8002"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/media", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
