name: Scheduled Quality

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Scheduled suite to run
        required: true
        default: youtube-canary
        type: choice
        options:
          - youtube-canary
          - nightly-proof
          - all

permissions:
  contents: read

concurrency:
  group: scheduled-quality-${{ github.event.schedule || inputs.suite || github.run_id }}
  cancel-in-progress: true

jobs:
  youtube-canary:
    if: >-
      github.event.schedule == '17 * * * *' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.suite == 'youtube-canary' || inputs.suite == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with: { version: "11.5.2" }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @carve/extension build:chrome
      - working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: Run deterministic packaged-extension replay
        working-directory: e2e
        env: { CI: "true" }
        run: >-
          xvfb-run -a pnpm exec playwright test
          tests/extension-streaming.spec.ts
          --project=web-chromium
          --retries=0
      - name: Probe live YouTube (advisory)
        id: live_youtube
        continue-on-error: true
        working-directory: e2e
        env: { LIVE_PROVIDER_TESTS: "1", CI: "true" }
        run: >-
          xvfb-run -a pnpm exec playwright test
          tests/live-youtube-canary.spec.ts
          --project=web-chromium
          --retries=0
      - name: Report live-provider health
        if: always()
        env:
          LIVE_YOUTUBE_OUTCOME: ${{ steps.live_youtube.outcome }}
        run: |
          if [ "$LIVE_YOUTUBE_OUTCOME" = "failure" ]; then
            echo "::warning title=Live YouTube probe degraded::The deterministic packaged-extension replay passed, but youtube.com did not produce a cue. Diagnostics are attached to this run."
            echo "### Live YouTube probe: degraded" >> "$GITHUB_STEP_SUMMARY"
            echo "YouTube did not produce a subtitle cue from this runner. The deterministic packaged-extension replay remains the blocking regression gate; inspect the attached trace before changing provider integration code." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$LIVE_YOUTUBE_OUTCOME" = "success" ]; then
            echo "### Live YouTube probe: healthy" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Live YouTube probe: not run" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload live-provider diagnostics
        if: always() && steps.live_youtube.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: live-youtube-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 7

  nightly-proof:
    if: >-
      github.event.schedule == '30 2 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.suite == 'nightly-proof' || inputs.suite == 'all'))
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carve
          POSTGRES_PASSWORD: carve
          POSTGRES_DB: carve
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carve -d carve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with: { version: "11.5.2" }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - uses: actions/setup-go@v6
        with: { go-version: "1.26", cache-dependency-path: services/api/go.sum }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: pnpm install --frozen-lockfile
      - run: pip install -r services/nlp/requirements.txt mutmut==3.6.0
      - run: go install github.com/avito-tech/go-mutesting/cmd/go-mutesting@v0.0.0-20251226130216-48d0401f00fb
      - run: pnpm --filter @carve/extension exec stryker run
      - run: pnpm --filter @carve/web exec stryker run
      - working-directory: services/nlp
        run: |
          mutmut run
          mutmut export-cicd-stats
          python - <<'PY'
          import json
          stats = json.load(open('mutants/mutmut-cicd-stats.json'))
          decided = stats['killed'] + stats['survived']
          score = stats['killed'] / decided if decided else 0
          print(f"Python mutation score: {score:.1%}")
          if score < 0.65:
              raise SystemExit('Python mutation score is below 65%')
          PY
      - run: scripts/run-go-mutation.sh
      - run: pnpm exec lhci autorun
      - name: Start isolated API for authenticated load proof
        env:
          DATABASE_URL: postgres://carve:carve@127.0.0.1:5432/carve?sslmode=disable
          JWT_SECRET: nightly-performance-secret-at-least-32-bytes
          EXPOSE_VERIFY_TOKENS: "1"
        run: |
          (cd services/api && go run ./cmd/migrate --dir ./migrations)
          (cd services/api && go build -o /tmp/carve-api ./cmd/api)
          /tmp/carve-api >/tmp/carve-api.log 2>&1 &
          echo $! >/tmp/carve-api.pid
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health/ready && break
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/carve-api.log
              exit 1
            fi
            sleep 1
          done
      - name: Run authenticated semantic load gate
        run: >-
          docker run --rm --add-host=host.docker.internal:host-gateway
          -v "$PWD/tests/perf:/scripts:ro"
          grafana/k6:2.0.0 run /scripts/load.js
          -e API_BASE=http://host.docker.internal:8080
      - name: Stop load-test API
        if: always()
        run: |
          test ! -f /tmp/carve-api.pid || kill "$(cat /tmp/carve-api.pid)" || true
          if [ "${{ job.status }}" != "success" ]; then cat /tmp/carve-api.log || true; fi
