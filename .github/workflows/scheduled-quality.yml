name: Scheduled Quality

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  youtube-canary:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: "11.5.2" }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @carve/extension build:chrome
      - working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium
      - working-directory: e2e
        env: { LIVE_PROVIDER_TESTS: "1", CI: "true" }
        run: xvfb-run -a pnpm exec playwright test tests/live-youtube-canary.spec.ts --project=web-chromium

  nightly-proof:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: "11.5.2" }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - uses: actions/setup-go@v6
        with: { go-version: "1.26", cache-dependency-path: services/api/go.sum }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: pnpm install --frozen-lockfile
      - run: pip install mutmut
      - run: go install github.com/avito-tech/go-mutesting/cmd/go-mutesting@latest
      - run: pnpm --filter @carve/extension exec stryker run
      - run: pnpm --filter @carve/web exec stryker run
      - working-directory: services/nlp
        run: |
          mutmut run
          mutmut export-cicd-stats
          python - <<'PY'
          import json
          stats = json.load(open('mutants/mutmut-cicd-stats.json'))
          decided = stats['killed'] + stats['survived']
          score = stats['killed'] / decided if decided else 0
          print(f"Python mutation score: {score:.1%}")
          if score < 0.65:
              raise SystemExit('Python mutation score is below 65%')
          PY
      - working-directory: services/api
        run: go-mutesting --threshold 0.65 ./internal/fsrs/... ./internal/importer/... ./internal/output/... ./internal/metrics/...
      - run: npm install -g @lhci/cli@0.13.x
      - run: lhci autorun
