name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Hourly streaming canary; nightly perf + mutation jobs.
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── NLP Service (Python) ───────────────────────────────────────────────────
  nlp:
    name: NLP Service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/nlp/requirements.txt

      - name: Install dependencies
        working-directory: services/nlp
        run: pip install -r requirements.txt

      - name: Download and import JMdict
        working-directory: services/nlp
        run: |
          mkdir -p data
          curl -sL "http://ftp.edrdg.org/pub/Nihongo/JMdict_e.gz" -o data/JMdict_e.gz
          gzip -d data/JMdict_e.gz
          python scripts/import_jmdict.py

      - name: Run correctness test suite (Phase 0 gate)
        working-directory: services/nlp
        run: |
          python -m pytest \
            tests/test_correctness.py \
            tests/test_correctness_zh.py \
            tests/test_correctness_ko.py \
            tests/test_correctness_en.py \
            -v --tb=short -q

      - name: Run API tests
        working-directory: services/nlp
        run: |
          python -m pytest tests/test_api.py -v \
            --tb=short

      - name: Verify all tests pass (combined)
        working-directory: services/nlp
        run: |
          python -m pytest tests/ -v --tb=short
          echo "✓ All NLP tests passed — Phase 0 gate cleared"

      - name: Import Tatoeba sentence pairs
        working-directory: services/nlp
        run: |
          python scripts/import_tatoeba.py --limit 50000
          echo "✓ Tatoeba sentences imported"

  # ── Core API (Go) ─────────────────────────────────────────────────────────
  api:
    name: Core API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: services/api/go.sum

      - name: Vet
        working-directory: services/api
        run: go vet ./...

      - name: Test
        working-directory: services/api
        run: go test ./... -v -race -count=1

      - name: Build
        working-directory: services/api
        run: |
          go build -o /dev/null ./cmd/api
          go build -o /dev/null ./cmd/migrate
          echo "✓ Go build succeeded"

  # ── Rust WASM Tokenizer ────────────────────────────────────────────────────
  wasm:
    name: WASM Tokenizer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Run unit tests (native)
        working-directory: apps/extension/wasm-src/ja-tokenizer
        run: cargo test

      - name: Build WASM package
        working-directory: apps/extension/wasm-src/ja-tokenizer
        run: wasm-pack build --target web --release

      - name: Verify WASM output exists
        working-directory: apps/extension/wasm-src/ja-tokenizer
        run: |
          test -f pkg/ja_tokenizer.js
          test -f pkg/ja_tokenizer_bg.wasm
          echo "✓ WASM build succeeded"

  # ── Media Service (Go) ────────────────────────────────────────────────────
  media:
    name: Media Service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build
        working-directory: services/media
        run: |
          go vet ./...
          go build -o /dev/null ./cmd/media
          echo "✓ Media service build succeeded"

  # ── Browser Extension ─────────────────────────────────────────────────────
  extension:
    name: Browser Extension (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox, safari]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json

      - name: Install dependencies
        working-directory: apps/extension
        run: npm ci

      - name: Type-check
        working-directory: apps/extension
        run: npm run typecheck

      - name: Build (${{ matrix.browser }})
        working-directory: apps/extension
        run: npm run build:${{ matrix.browser }}

      - name: Verify dist artifacts (${{ matrix.browser }})
        working-directory: apps/extension
        run: |
          test -f dist/${{ matrix.browser }}/manifest.json
          test -f dist/${{ matrix.browser }}/background/index.js
          test -f dist/${{ matrix.browser }}/content/index.js
          test -f dist/${{ matrix.browser }}/popup/app.js
          test -f dist/${{ matrix.browser }}/popup/index.html
          echo "✓ ${{ matrix.browser }} extension artifacts present"

      - name: Upload extension artifact (${{ matrix.browser }})
        uses: actions/upload-artifact@v6
        with:
          name: extension-${{ matrix.browser }}
          path: apps/extension/dist/${{ matrix.browser }}/
          retention-days: 7

  # ── Web App (SvelteKit) ───────────────────────────────────────────────────
  web:
    name: Web App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Type-check
        working-directory: apps/web
        run: npm run check

      - name: Build
        working-directory: apps/web
        run: npm run build

  # ── Extension e2e (Playwright) ────────────────────────────────────────────
  extension-e2e:
    name: Extension E2E
    runs-on: ubuntu-latest
    needs: [extension]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json

      - name: Download Chrome extension artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-chrome
          path: apps/extension/dist/chrome

      - name: Download Firefox extension artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-firefox
          path: apps/extension/dist/firefox

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Run extension e2e tests
        working-directory: e2e
        run: node extension.test.js

      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: extension-e2e-screenshot
          path: e2e/extension-e2e.png

  # ── Integration: Docker Compose ───────────────────────────────────────────
  integration:
    name: Docker Compose Integration
    runs-on: ubuntu-latest
    needs: [nlp, api, wasm, media]

    steps:
      - uses: actions/checkout@v5

      - name: Download JMdict for NLP image
        working-directory: services/nlp
        run: |
          mkdir -p data
          curl -sL "http://ftp.edrdg.org/pub/Nihongo/JMdict_e.gz" -o data/JMdict_e.gz
          gzip -d data/JMdict_e.gz
          pip install sudachipy sudachidict-core
          python scripts/import_jmdict.py

      - name: Build and start services
        run: docker compose up -d --build postgres redis api nlp
        timeout-minutes: 10

      - name: Wait for services to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health && curl -sf http://localhost:8001/health; then
              echo "✓ Both services healthy"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done
          echo "Services did not become healthy in time"
          docker compose logs
          exit 1

      - name: "Smoke test: API health"
        run: |
          curl -sf http://localhost:8080/health | grep '"status":"ok"'

      - name: "Smoke test: NLP tokenize endpoint"
        run: |
          curl -sf -X POST http://localhost:8001/tokenize \
            -H 'Content-Type: application/json' \
            -d '{"text":"食べる","language":"ja"}' | \
            python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d['tokens'])>0, 'no tokens'"
          echo "✓ NLP tokenize works"

      - name: "Smoke test: NLP Migaku failure cases"
        run: |
          # Test ございません reading
          READING=$(curl -sf -X POST http://localhost:8001/tokenize \
            -H 'Content-Type: application/json' \
            -d '{"text":"ございません","language":"ja","mode":"A"}' | \
            python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          print(''.join(t['reading_hira'] for t in d['tokens']))
          ")
          if [ "$READING" = "ございません" ]; then
            echo "✓ ございません reads correctly: $READING"
          else
            echo "✗ FAIL: ございません reads as $READING (expected ございません)"
            exit 1
          fi

      - name: Teardown
        if: always()
        run: docker compose down -v

  # ── Schema validation ──────────────────────────────────────────────────────
  schema:
    name: SQL Schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carve
          POSTGRES_PASSWORD: carve
          POSTGRES_DB: carve
        options: >-
          --health-cmd "pg_isready -U carve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: services/api/go.sum

      - name: Run migrations against test database
        working-directory: services/api
        env:
          DATABASE_URL: postgres://carve:carve@localhost:5432/carve?sslmode=disable
        run: |
          go run ./cmd/migrate --dir ./migrations
          echo "✓ Migrations applied cleanly"

  # ── L3 testcontainers integration ─────────────────────────────────────────
  integration-l3:
    name: L3 — Integration (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.26", cache-dependency-path: services/api/go.sum }
      - name: Run integration tests
        working-directory: services/api
        run: go test ./... -count=1 -timeout 10m -run "TestImportAnki_|TestProperty_|TestRoundTrip_|TestMap_|TestCorpus"
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  # ── L4 contract fuzz (schemathesis) ───────────────────────────────────────
  contract:
    name: L4 — API contract (schemathesis)
    runs-on: ubuntu-latest
    needs: [api]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: carve, POSTGRES_PASSWORD: carve, POSTGRES_DB: carve }
        options: --health-cmd "pg_isready -U carve" --health-interval 5s --health-retries 10
        ports: [ "5432:5432" ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.26", cache-dependency-path: services/api/go.sum }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - name: Apply migrations
        working-directory: services/api
        env: { DATABASE_URL: "postgres://carve:carve@localhost:5432/carve?sslmode=disable" }
        run: go run ./cmd/migrate --dir ./migrations
      - name: Boot API
        working-directory: services/api
        env:
          DATABASE_URL: postgres://carve:carve@localhost:5432/carve?sslmode=disable
          JWT_SECRET: ci-test-secret-at-least-32-chars-long
          PORT: "8090"
        run: |
          go build -o ../api-bin ./cmd/api
          ../api-bin &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8090/health && break || sleep 1
          done
      - name: Install schemathesis
        run: pip install schemathesis
      - name: Run contract fuzz
        run: |
          # Limit to a reasonable amount of hypothesis examples per endpoint
          schemathesis run --base-url http://127.0.0.1:8090 \
                          --max-examples 25 \
                          --hypothesis-deadline 5000 \
                          docs/openapi.yaml || \
          echo "::warning ::schemathesis surfaced findings (non-blocking on first wiring)"

  # ── L5–L9 Playwright matrix (web + a11y + offline) ────────────────────────
  e2e-web:
    name: L5–L9 — Playwright (web)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [web-chromium, web-firefox, web-webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Install web deps
        working-directory: apps/web
        run: npm ci
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps ${{ matrix.project == 'web-firefox' && 'firefox' || matrix.project == 'web-webkit' && 'webkit' || 'chromium' }}
      - name: Run Playwright (${{ matrix.project }})
        working-directory: e2e
        env: { CI: "true" }
        run: npx playwright test --project=${{ matrix.project }} --grep-invert "extension|visual"
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-${{ matrix.project }}
          path: e2e/playwright-report/

  # ── L6 extension fixture replay (jsdom) ───────────────────────────────────
  extension-fixtures:
    name: L6 — Extension fixture replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache-dependency-path: apps/extension/package-lock.json }
      - name: Install
        working-directory: apps/extension
        run: npm ci
      - name: Run fixture tests
        working-directory: apps/extension
        run: npx vitest run src/content/video/__tests__/platforms.test.ts

  # ── L13 Lighthouse perf budget (PR warning, nightly hard fail) ────────────
  perf:
    name: L13 — Lighthouse perf budget
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Install lhci
        run: npm install -g @lhci/cli@0.13.x
      - name: Web deps
        working-directory: apps/web
        run: npm ci
      - name: Lighthouse CI
        run: lhci autorun || echo "::warning ::lighthouse missed budget"

  # ── L2 mutation testing (nightly) ─────────────────────────────────────────
  mutation:
    name: L2 — Mutation testing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.26", cache-dependency-path: services/api/go.sum }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Install Go mutation tool
        run: go install github.com/avito-tech/go-mutesting/cmd/go-mutesting@latest
      - name: Install mutmut
        run: pip install mutmut
      - name: Run Go mutation
        working-directory: services/api
        run: go-mutesting --threshold 0.65 ./internal/fsrs/... ./internal/importer/... ./internal/output/... ./internal/metrics/... || true
      - name: Run extension Stryker
        working-directory: apps/extension
        run: npm ci && npx stryker run || true
      - name: Run web Stryker
        working-directory: apps/web
        run: npm ci && npx stryker run || true

  # ── L11 streaming canary (hourly via schedule, on-demand via dispatch) ─────
  streaming-canary:
    name: L11 — Streaming canary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Build extension
        working-directory: apps/extension
        run: npm ci && npm run build:chrome
      # Playwright's webServer (see e2e/playwright.config.ts) launches `vite` from
      # apps/web, so its deps must be installed here too — without this the canary
      # died with `vite: not found` / exit 127 on every scheduled run.
      - name: Web deps
        working-directory: apps/web
        run: npm ci
      - name: e2e deps
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run streaming canary
        working-directory: e2e
        env: { CI: "true" }
        # Canary is informational only: never fail the job (see hourly-schedule comment above).
        # A broken `|| \` line-continuation previously turned the fallback into `\ echo`,
        # which exited 127 and failed every scheduled run.
        run: |
          npx playwright test tests/extension-streaming.spec.ts \
            || echo "::warning ::canary failed — DOM drift suspected; investigate within the hour"
