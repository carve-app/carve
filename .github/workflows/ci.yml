name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Least privilege: these are build/test-only jobs (no GitHub API writes), and
# this workflow runs untrusted PR code. Restrict the default GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  quality:
    name: Workspace Quality Gates
    runs-on: ubuntu-latest
    needs: [wasm]
    steps:
      - uses: actions/checkout@v5
      - name: Download tested WASM package
        uses: actions/download-artifact@v7
        with:
          name: wasm-ja-tokenizer
          path: apps/extension/wasm-src/ja-tokenizer/pkg
      - uses: pnpm/action-setup@v4
        with: { version: "11.5.2" }

      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm test:flow-docs
      - run: pnpm audit --audit-level moderate

  # ── NLP Service (Python) ───────────────────────────────────────────────────
  nlp:
    name: NLP Service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/nlp/requirements.txt

      - name: Install dependencies
        working-directory: services/nlp
        run: pip install -r requirements.txt

      - name: Download and import JMdict
        working-directory: services/nlp
        run: |
          mkdir -p data
          curl -sL "http://ftp.edrdg.org/pub/Nihongo/JMdict_e.gz" -o data/JMdict_e.gz
          gzip -d data/JMdict_e.gz
          python scripts/import_jmdict.py

      - name: Import WordNet (English monolingual dictionary)
        working-directory: services/nlp
        run: python scripts/import_wordnet.py

      - name: Import multilingual dictionaries (zh, ko, es/de/fr/it/pt)
        working-directory: services/nlp
        run: |
          # CC-CEDICT (zh, ~4 MB download), curated Korean list (no download),
          # and FreeDict bilingual dicts (es/de/fr/it/pt, ~40 MB total download).
          # All write into the same data/dictionary.db the JMdict step created.
          python scripts/import_cedict_sqlite.py
          python scripts/import_kde4_sqlite.py
          python scripts/import_freedict.py

      - name: Run correctness test suite (Phase 0 gate)
        working-directory: services/nlp
        run: |
          python -m pytest \
            tests/test_correctness.py \
            tests/test_correctness_zh.py \
            tests/test_correctness_ko.py \
            tests/test_correctness_en.py \
            -v --tb=short -q

      - name: Run API tests
        working-directory: services/nlp
        run: |
          python -m pytest tests/test_api.py -v \
            --tb=short

      - name: Verify all tests pass (combined)
        working-directory: services/nlp
        run: |
          python -m pytest tests/ -v --tb=short
          echo "✓ All NLP tests passed — Phase 0 gate cleared"

      - name: Import Tatoeba sentence pairs
        working-directory: services/nlp
        run: |
          python scripts/import_tatoeba.py --limit 50000
          echo "✓ Tatoeba sentences imported"

  # ── Core API (Go) ─────────────────────────────────────────────────────────
  api:
    name: Core API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: services/api/go.sum

      - name: Vet
        working-directory: services/api
        run: go vet ./...

      - name: Test
        working-directory: services/api
        run: go test ./... -v -race -count=1

      - name: Build
        working-directory: services/api
        run: |
          go build -o /dev/null ./cmd/api
          go build -o /dev/null ./cmd/migrate
          echo "✓ Go build succeeded"

  # ── Rust WASM Tokenizer ────────────────────────────────────────────────────
  wasm:
    name: WASM Tokenizer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Run unit tests (native)
        run: |
          cargo test --locked --manifest-path apps/extension/wasm-src/ja-tokenizer/Cargo.toml
          cargo test --locked --manifest-path apps/extension/wasm-src/ko-tokenizer/Cargo.toml
          cargo test --locked --manifest-path apps/extension/wasm-src/zh-tokenizer/Cargo.toml

      - name: Build WASM package
        working-directory: apps/extension/wasm-src/ja-tokenizer
        run: wasm-pack build --target web --release

      - name: Verify WASM output exists
        working-directory: apps/extension/wasm-src/ja-tokenizer
        run: |
          test -f pkg/ja_tokenizer.js
          test -f pkg/ja_tokenizer_bg.wasm
          echo "✓ WASM build succeeded"

      - name: Upload tested WASM package
        uses: actions/upload-artifact@v6
        with:
          name: wasm-ja-tokenizer
          path: apps/extension/wasm-src/ja-tokenizer/pkg/
          retention-days: 1

  # ── Media Service (Go) ────────────────────────────────────────────────────
  media:
    name: Media Service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build
        working-directory: services/media
        run: |
          go vet ./...
          go test ./... -race -count=1
          go build -o /dev/null ./cmd/media
          echo "✓ Media service build succeeded"

  # ── Browser Extension ─────────────────────────────────────────────────────
  extension:
    name: Browser Extension (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox, safari]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with: { version: "11.5.2" }

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter @carve/extension typecheck

      - name: Build (${{ matrix.browser }})
        run: pnpm --filter @carve/extension build:${{ matrix.browser }}

      - name: Verify dist artifacts (${{ matrix.browser }})
        working-directory: apps/extension
        run: |
          test -f dist/${{ matrix.browser }}/manifest.json
          test -f dist/${{ matrix.browser }}/background/index.js
          test -f dist/${{ matrix.browser }}/content/index.js
          test -f dist/${{ matrix.browser }}/popup/app.js
          test -f dist/${{ matrix.browser }}/popup/index.html
          echo "✓ ${{ matrix.browser }} extension artifacts present"

      - name: Upload extension artifact (${{ matrix.browser }})
        uses: actions/upload-artifact@v6
        with:
          name: extension-${{ matrix.browser }}
          path: apps/extension/dist/${{ matrix.browser }}/
          retention-days: 7

  # ── Web App (SvelteKit) ───────────────────────────────────────────────────
  web:
    name: Web App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with: { version: "11.5.2" }

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter @carve/web typecheck

      - name: Build
        run: pnpm --filter @carve/web build && test -f apps/web/build/index.html

  # ── Extension e2e (Playwright) ────────────────────────────────────────────
  extension-e2e:
    name: Extension E2E
    runs-on: ubuntu-latest
    needs: [extension]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with: { version: "11.5.2" }

      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Download Chrome extension artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-chrome
          path: apps/extension/dist/chrome

      - name: Download Firefox extension artifact
        uses: actions/download-artifact@v7
        with:
          name: extension-firefox
          path: apps/extension/dist/firefox

      - name: Install e2e dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: e2e
        run: pnpm exec playwright install chromium --with-deps

      - name: Validate Firefox package
        working-directory: e2e
        run: pnpm exec web-ext lint --source-dir ../apps/extension/dist/firefox

      - name: Run extension e2e tests
        working-directory: e2e
        env:
          FIREFOX_BINARY: firefox
        run: |
          node extension.test.js
          xvfb-run -a node firefox-extension-smoke.cjs

      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: extension-e2e-screenshot
          path: e2e/extension-e2e.png

  # ── Real video sentence-mining e2e (full stack) ───────────────────────────
  video-mining:
    name: Video mining (real stack)
    runs-on: ubuntu-latest
    needs: [api, media]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: services/api/go.sum

      - uses: pnpm/action-setup@v4
        with: { version: "11.5.2" }

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ffmpeg (for the audio/video fixture)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build Go binaries (api, migrate, media)
        run: |
          mkdir -p bin
          (cd services/api && go build -o ../../bin/api ./cmd/api && go build -o ../../bin/migrate ./cmd/migrate)
          (cd services/media && go build -o ../../bin/media ./cmd/media)

      - name: Build chrome extension
        run: pnpm --filter @carve/extension build:chrome

      - name: Generate the fixture video (vp8 + opus, with audio tone)
        run: |
          mkdir -p e2e/fixtures/media
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=0x1e88e5:s=480x270:d=6,format=yuv420p" \
            -f lavfi -i "sine=frequency=440:duration=6" \
            -c:v libvpx -b:v 400k -c:a libopus -b:a 96k -shortest \
            e2e/fixtures/media/sample.webm

      - name: Install e2e deps + Playwright Chromium
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real video-mining e2e
        working-directory: e2e
        run: node video-mining.test.js

  real-stack:
    name: Core journeys (real stack)
    runs-on: ubuntu-latest
    needs: [api, media, web]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - uses: pnpm/action-setup@v4
        with: { version: "11.5.2" }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build NLP dictionaries
        working-directory: services/nlp
        run: |
          pip install -r requirements.txt
          mkdir -p data
          curl -fsSL "http://ftp.edrdg.org/pub/Nihongo/JMdict_e.gz" -o data/JMdict_e.gz
          gzip -d data/JMdict_e.gz
          python scripts/import_jmdict.py
          python scripts/import_wordnet.py
          python scripts/import_cedict_sqlite.py
          python scripts/import_kde4_sqlite.py
          python scripts/import_freedict.py
      - name: Install Playwright Chromium
        working-directory: e2e
        run: pnpm exec playwright install chromium --with-deps
      - name: Run isolated real-stack core journeys
        run: ./scripts/test-real-stack.sh

  # ── Integration: Docker Compose ───────────────────────────────────────────
  integration:
    name: Docker Compose Integration
    runs-on: ubuntu-latest
    needs: [nlp, api, wasm, media]

    steps:
      - uses: actions/checkout@v5

      - name: Download JMdict for NLP image
        working-directory: services/nlp
        run: |
          mkdir -p data
          curl -sL "http://ftp.edrdg.org/pub/Nihongo/JMdict_e.gz" -o data/JMdict_e.gz
          gzip -d data/JMdict_e.gz
          pip install sudachipy sudachidict-core wordfreq
          python scripts/import_jmdict.py
          python scripts/import_wordnet.py

      - name: Import multilingual dictionaries for NLP image
        working-directory: services/nlp
        run: |
          # Bake zh/ko/es/de/fr/it/pt dictionaries into the same SQLite db.
          python scripts/import_cedict_sqlite.py
          python scripts/import_kde4_sqlite.py
          python scripts/import_freedict.py

      - name: Build and start services
        run: docker compose up -d --build postgres redis api nlp
        timeout-minutes: 10

      - name: Wait for services to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health && curl -sf http://localhost:8001/health; then
              echo "✓ Both services healthy"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done
          echo "Services did not become healthy in time"
          docker compose logs
          exit 1

      - name: "Smoke test: API health"
        run: |
          curl -sf http://localhost:8080/health | grep '"status":"ok"'

      - name: "Smoke test: NLP tokenize endpoint"
        run: |
          curl -sf -X POST http://localhost:8001/tokenize \
            -H 'Content-Type: application/json' \
            -d '{"text":"食べる","language":"ja"}' | \
            python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d['tokens'])>0, 'no tokens'"
          echo "✓ NLP tokenize works"

      - name: "Smoke test: NLP Migaku failure cases"
        run: |
          # Test ございません reading
          READING=$(curl -sf -X POST http://localhost:8001/tokenize \
            -H 'Content-Type: application/json' \
            -d '{"text":"ございません","language":"ja","mode":"A"}' | \
            python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          print(''.join(t['reading_hira'] for t in d['tokens']))
          ")
          if [ "$READING" = "ございません" ]; then
            echo "✓ ございません reads correctly: $READING"
          else
            echo "✗ FAIL: ございません reads as $READING (expected ございません)"
            exit 1
          fi

      - name: Teardown
        if: always()
        run: docker compose down -v

  # ── Schema validation ──────────────────────────────────────────────────────
  schema:
    name: SQL Schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carve
          POSTGRES_PASSWORD: carve
          POSTGRES_DB: carve
        options: >-
          --health-cmd "pg_isready -U carve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: services/api/go.sum

      - name: Run staged upgrade and idempotent migration replay
        working-directory: services/api
        env:
          DATABASE_URL: postgres://carve:carve@localhost:5432/carve?sslmode=disable
        run: |
          mkdir -p /tmp/carve-old-migrations
          find ./migrations -maxdepth 1 -name '*.sql' \
            ! -name '015_*' ! -name '016_*' ! -name '017_*' ! -name '018_*' \
            -exec cp {} /tmp/carve-old-migrations/ \;
          go run ./cmd/migrate --dir /tmp/carve-old-migrations
          go run ./cmd/migrate --dir ./migrations
          go run ./cmd/migrate --dir ./migrations
          echo "✓ Staged upgrade and replay applied cleanly"

      - name: Prove backup and restore
        env:
          PGPASSWORD: carve
        run: |
          psql -h localhost -U carve -d carve -v ON_ERROR_STOP=1 \
            -c "INSERT INTO users (email, display_name) VALUES ('backup-proof@example.com', 'Backup Proof')"
          pg_dump -h localhost -U carve -d carve --format=custom --file=/tmp/carve.dump
          psql -h localhost -U carve -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE carve_restore"
          pg_restore -h localhost -U carve -d carve_restore --exit-on-error /tmp/carve.dump
          test "$(psql -h localhost -U carve -d carve_restore -Atc \
            "SELECT count(*) FROM users WHERE email='backup-proof@example.com'")" = "1"
          test "$(psql -h localhost -U carve -d carve_restore -Atc \
            "SELECT count(*) FROM schema_migrations")" = \
            "$(psql -h localhost -U carve -d carve -Atc \
            "SELECT count(*) FROM schema_migrations")"
          echo "✓ Logical backup restored with data and complete migration history"

  # ── L3 testcontainers integration ─────────────────────────────────────────
  integration-l3:
    name: L3 — Integration (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.26", cache-dependency-path: services/api/go.sum }
      - name: Run integration tests
        working-directory: services/api
        run: go test ./... -count=1 -timeout 10m -run "TestImportAnki_|TestProperty_|TestRoundTrip_|TestMap_|TestCorpus"
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  # ── L4 contract fuzz (schemathesis) ───────────────────────────────────────
  contract:
    name: L4 — API contract (schemathesis)
    runs-on: ubuntu-latest
    needs: [api]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: carve, POSTGRES_PASSWORD: carve, POSTGRES_DB: carve }
        options: --health-cmd "pg_isready -U carve" --health-interval 5s --health-retries 10
        ports: [ "5432:5432" ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.26", cache-dependency-path: services/api/go.sum }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - name: Apply migrations
        working-directory: services/api
        env: { DATABASE_URL: "postgres://carve:carve@localhost:5432/carve?sslmode=disable" }
        run: go run ./cmd/migrate --dir ./migrations
      - name: Boot API
        working-directory: services/api
        env:
          DATABASE_URL: postgres://carve:carve@localhost:5432/carve?sslmode=disable
          JWT_SECRET: ci-test-secret-at-least-32-chars-long
          PORT: "8090"
          EXPOSE_VERIFY_TOKENS: "1"
        run: |
          go build -o ../api-bin ./cmd/api
          ../api-bin &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8090/health; then
              exit 0
            fi
            echo "Waiting for API health... ($attempt/30)"
            sleep 1
          done
          echo "API did not become healthy in time"
          exit 1
      - name: Install schemathesis
        run: pip install schemathesis==4.4.4
      - name: Create contract-test identity
        id: contract-auth
        run: |
          verification_token="$(curl -fsS -X POST http://127.0.0.1:8090/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"contract@example.com","password":"contract-password-123","display_name":"Contract"}' \
            | python -c 'import json,sys; print(json.load(sys.stdin)["verification_token_test"])')"
          curl -fsS -X POST http://127.0.0.1:8090/v1/auth/verify \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$verification_token\"}" >/dev/null
          token="$(curl -fsS -X POST http://127.0.0.1:8090/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"contract@example.com","password":"contract-password-123"}' \
            | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Run contract fuzz
        run: |
          schemathesis run docs/openapi.yaml \
            --url http://127.0.0.1:8090 \
            --phases coverage,fuzzing \
            --max-examples 25 \
            --request-timeout 5 \
            --exclude-path-regex '^/v1/billing/' \
            --exclude-operation-id deleteMe \
            --checks status_code_conformance,content_type_conformance \
            --header "Authorization: Bearer ${{ steps.contract-auth.outputs.token }}"

  # ── L5–L9 Playwright matrix (web + a11y + offline) ────────────────────────
  e2e-web:
    name: L5–L9 — Playwright (web)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: web-chromium
            browser: chromium
          - project: web-firefox
            browser: firefox
          - project: web-webkit
            browser: webkit
          - project: web-mobile
            browser: webkit
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: "11.5.2" }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - name: Install web deps
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: e2e
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run Playwright (${{ matrix.project }})
        working-directory: e2e
        env: { CI: "true" }
        run: pnpm exec playwright test --project=${{ matrix.project }} --grep-invert "extension|visual"
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-${{ matrix.project }}
          path: e2e/playwright-report/

  visual:
    name: L7 — Visual regression (Chromium/macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: "11.5.2" }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: e2e
        run: pnpm exec playwright install chromium
      - name: Compare committed visual baselines
        working-directory: e2e
        env: { CI: "true" }
        run: pnpm exec playwright test visual.spec.ts --project=web-chromium
      - name: Upload visual diff
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-regression-diff
          path: e2e/test-results/

  # ── L6 extension fixture replay (jsdom) ───────────────────────────────────
  extension-fixtures:
    name: L6 — Extension fixture replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: "11.5.2" }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run fixture tests
        run: pnpm --filter @carve/extension exec vitest run src/content/video/__tests__/platforms.test.ts
