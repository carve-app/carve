name: Deploy Phase 1 VM

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy. Defaults to the current commit SHA."
        required: false
        default: ""

concurrency:
  group: deploy-phase1
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push VM images
    runs-on: ubuntu-latest
    outputs:
      image_registry: ${{ steps.meta.outputs.image_registry }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${{ github.event.inputs.image_tag }}"
          if [[ -z "$tag" ]]; then
            tag="${GITHUB_SHA::12}"
          fi
          echo "image_registry=$repo" >> "$GITHUB_OUTPUT"
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push api
        run: |
          repo="${{ steps.meta.outputs.image_registry }}/api"
          tag="${{ steps.meta.outputs.image_tag }}"
          docker build -t "$repo:$tag" -t "$repo:latest" services/api
          docker push "$repo:$tag"
          docker push "$repo:latest"

      - name: Build and push media
        run: |
          repo="${{ steps.meta.outputs.image_registry }}/media"
          tag="${{ steps.meta.outputs.image_tag }}"
          docker build -t "$repo:$tag" -t "$repo:latest" services/media
          docker push "$repo:$tag"
          docker push "$repo:latest"

      - name: Prepare NLP dictionary
        working-directory: services/nlp
        run: |
          python -m pip install --upgrade pip
          pip install sudachipy sudachidict-core wordfreq
          mkdir -p data
          curl -sL "http://ftp.edrdg.org/pub/Nihongo/JMdict_e.gz" -o data/JMdict_e.gz
          gzip -d -f data/JMdict_e.gz
          python scripts/import_jmdict.py
          python scripts/import_wordnet.py
          python scripts/import_cedict_sqlite.py
          python scripts/import_kde4_sqlite.py
          python scripts/import_freedict.py

      - name: Build and push nlp
        run: |
          repo="${{ steps.meta.outputs.image_registry }}/nlp"
          tag="${{ steps.meta.outputs.image_tag }}"
          docker build -t "$repo:$tag" -t "$repo:latest" services/nlp
          docker push "$repo:$tag"
          docker push "$repo:latest"

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: build
    environment: prod
    env:
      PHASE1_HOST: ${{ secrets.PHASE1_HOST }}
      PHASE1_USER: ${{ secrets.PHASE1_USER }}
      PHASE1_PORT: ${{ secrets.PHASE1_PORT }}
      PHASE1_APP_DIR: ${{ secrets.PHASE1_APP_DIR }}
      PHASE1_SSH_KEY: ${{ secrets.PHASE1_SSH_KEY }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      GHCR_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v5

      - name: Check required secrets
        run: |
          test -n "$PHASE1_HOST" || { echo "PHASE1_HOST is required"; exit 1; }
          test -n "$PHASE1_USER" || { echo "PHASE1_USER is required"; exit 1; }
          test -n "$PHASE1_SSH_KEY" || { echo "PHASE1_SSH_KEY is required"; exit 1; }

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PHASE1_SSH_KEY" > ~/.ssh/phase1
          chmod 600 ~/.ssh/phase1
          port="${PHASE1_PORT:-22}"
          ssh-keyscan -p "$port" "$PHASE1_HOST" >> ~/.ssh/known_hosts

      - name: Copy deployment bundle
        run: |
          port="${PHASE1_PORT:-22}"
          app_dir="${PHASE1_APP_DIR:-/opt/carve/phase1}"
          tar -C deploy/phase1 -czf - . | \
            ssh -i ~/.ssh/phase1 -p "$port" "$PHASE1_USER@$PHASE1_HOST" \
              "mkdir -p '$app_dir' && tar -xzf - -C '$app_dir'"

      - name: Login remote Docker to GHCR
        if: env.GHCR_READ_TOKEN != ''
        run: |
          port="${PHASE1_PORT:-22}"
          printf '%s' "$GHCR_READ_TOKEN" | \
            ssh -i ~/.ssh/phase1 -p "$port" "$PHASE1_USER@$PHASE1_HOST" \
              "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Deploy
        run: |
          port="${PHASE1_PORT:-22}"
          app_dir="${PHASE1_APP_DIR:-/opt/carve/phase1}"
          image_registry="${{ needs.build.outputs.image_registry }}"
          image_tag="${{ needs.build.outputs.image_tag }}"

          ssh -i ~/.ssh/phase1 -p "$port" "$PHASE1_USER@$PHASE1_HOST" \
            APP_DIR="$app_dir" IMAGE_REGISTRY="$image_registry" IMAGE_TAG="$image_tag" /bin/sh <<'EOF'
            set -eu
            cd "$APP_DIR"
            chmod +x scripts/*.sh
            if [ ! -f .env ]; then
              ./scripts/bootstrap-env.sh
              echo ".env was created at $APP_DIR/.env. Fill in Terraform outputs and R2 keys, then rerun this workflow."
              exit 2
            fi
            printf 'IMAGE_REGISTRY=%s\nIMAGE_TAG=%s\n' "$IMAGE_REGISTRY" "$IMAGE_TAG" > release.env
            ./scripts/deploy.sh
          EOF
