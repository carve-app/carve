name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "services/nlp/**"
      - "services/media/**"
      - "infra/terraform/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy (api, nlp, media, or all)"
        required: false
        default: "all"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  PROJECT: carve
  ENV: prod

permissions:
  id-token: write     # OIDC
  contents: read

jobs:

  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.f.outputs.api }}
      nlp: ${{ steps.f.outputs.nlp }}
      media: ${{ steps.f.outputs.media }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 2 }
      - id: f
        # Pass the dispatch input via env (not GitHub-expression interpolation)
        # so a crafted `service` value can't break out of the quotes and run
        # arbitrary commands in this id-token:write job.
        env:
          SERVICE: ${{ github.event.inputs.service }}
        run: |
          force="$SERVICE"
          if [[ "$force" == "all" || "$force" == "api"   ]]; then echo "api=true"   >> "$GITHUB_OUTPUT"; fi
          if [[ "$force" == "all" || "$force" == "nlp"   ]]; then echo "nlp=true"   >> "$GITHUB_OUTPUT"; fi
          if [[ "$force" == "all" || "$force" == "media" ]]; then echo "media=true" >> "$GITHUB_OUTPUT"; fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            changed=$(git diff --name-only HEAD^ HEAD)
            echo "$changed" | grep -q "^services/api/"   && echo "api=true"   >> "$GITHUB_OUTPUT" || true
            echo "$changed" | grep -q "^services/nlp/"   && echo "nlp=true"   >> "$GITHUB_OUTPUT" || true
            echo "$changed" | grep -q "^services/media/" && echo "media=true" >> "$GITHUB_OUTPUT" || true
          fi

  # ── Build + push images in parallel per service ──────────────────────────────

  build-api:
    name: Build & push api image
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        working-directory: services/api
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REPO="${AWS_ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.PROJECT }}/api"
          TAG="${{ steps.tag.outputs.tag }}"
          docker build -t "$REPO:$TAG" -t "$REPO:latest" .
          docker push "$REPO:$TAG"
          docker push "$REPO:latest"
          echo "Pushed $REPO:$TAG"

  build-nlp:
    name: Build & push nlp image
    needs: detect-changes
    if: needs.detect-changes.outputs.nlp == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Prepare dictionaries (JMdict + WordNet + multilingual)
        working-directory: services/nlp
        run: |
          # NLP image bundles a pre-built SQLite dict. Build it in CI so the
          # image is self-contained at runtime. JMdict = Japanese (needs
          # SudachiPy); WordNet = English monolingual; CC-CEDICT/FreeDict =
          # zh/ko/es/de/fr/it/pt. Multilingual importers are pure stdlib.
          pip install sudachipy sudachidict-core wordfreq
          mkdir -p data
          curl -sL "http://ftp.edrdg.org/pub/Nihongo/JMdict_e.gz" -o data/JMdict_e.gz
          gzip -d data/JMdict_e.gz
          python scripts/import_jmdict.py
          python scripts/import_wordnet.py
          # zh (CC-CEDICT), ko (curated list), es/de/fr/it/pt (FreeDict)
          python scripts/import_cedict_sqlite.py
          python scripts/import_kde4_sqlite.py
          python scripts/import_freedict.py

      - name: Build & push
        working-directory: services/nlp
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REPO="${AWS_ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.PROJECT }}/nlp"
          TAG="${{ steps.tag.outputs.tag }}"
          docker build -t "$REPO:$TAG" -t "$REPO:latest" .
          docker push "$REPO:$TAG"
          docker push "$REPO:latest"

  build-media:
    name: Build & push media image
    needs: detect-changes
    if: needs.detect-changes.outputs.media == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        working-directory: services/media
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REPO="${AWS_ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.PROJECT }}/media"
          TAG="${{ steps.tag.outputs.tag }}"
          docker build -t "$REPO:$TAG" -t "$REPO:latest" .
          docker push "$REPO:$TAG"
          docker push "$REPO:latest"

  # ── Migrations (one-off ECS RunTask using the api image) ─────────────────────

  migrate:
    name: Run DB migrations
    needs: [detect-changes, build-api]
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run migration task
        run: |
          CLUSTER="${{ env.PROJECT }}-${{ env.ENV }}-cluster"
          TASK_DEF="${{ env.PROJECT }}-${{ env.ENV }}-api"

          SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=${{ env.PROJECT }}-${{ env.ENV }}-public-*" \
            --query 'Subnets[].SubnetId' --output text | tr '\t' ',')
          SG=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${{ env.PROJECT }}-${{ env.ENV }}-ecs" \
            --query 'SecurityGroups[0].GroupId' --output text)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SG}],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["./migrate","--dir","./migrations"]}]}' \
            --query 'tasks[0].taskArn' --output text)

          echo "Started migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration task exit code: $EXIT"

          # Tail recent logs from the api log group for visibility.
          aws logs tail "/ecs/${{ env.PROJECT }}-${{ env.ENV }}/api" --since 5m || true

          [[ "$EXIT" == "0" ]] || exit 1

  # ── Roll services (force a new deployment to pull :latest) ───────────────────

  deploy-api:
    needs: [detect-changes, build-api, migrate]
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Force new deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.PROJECT }}-${{ env.ENV }}-cluster \
            --service api \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable \
            --cluster ${{ env.PROJECT }}-${{ env.ENV }}-cluster \
            --services api

  deploy-nlp:
    needs: [detect-changes, build-nlp]
    if: needs.detect-changes.outputs.nlp == 'true'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          aws ecs update-service \
            --cluster ${{ env.PROJECT }}-${{ env.ENV }}-cluster \
            --service nlp \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable \
            --cluster ${{ env.PROJECT }}-${{ env.ENV }}-cluster \
            --services nlp

  deploy-media:
    needs: [detect-changes, build-media]
    if: needs.detect-changes.outputs.media == 'true'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          aws ecs update-service \
            --cluster ${{ env.PROJECT }}-${{ env.ENV }}-cluster \
            --service media \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable \
            --cluster ${{ env.PROJECT }}-${{ env.ENV }}-cluster \
            --services media
