# mutmut configuration for the NLP service. Run with:
#
#     mutmut run --paths-to-mutate=src/ \
#                --tests-dir=tests/ \
#                --runner='.venv/bin/python -m pytest -x'
#
# CI invokes this via `make test-mutation-nlp`. The score is parsed from
# the mutmut results and posted as a GitHub status check; a regression
# below 65% on any module blocks the next release tag.

[tool.mutmut]
paths_to_mutate = "src/"
tests_dir = "tests/"
runner = ".venv/bin/python -m pytest -x --tb=no -q"
backup = false
# Skip pure data tables (the irregular-verb dict) — they have no logic.
also_copy = []
